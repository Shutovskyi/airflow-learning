name: Refresh BigQuery spend

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * *"
      timezone: America/Los_Angeles

permissions:
  contents: read
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v3
        with:
          project_id: psychic-diorama-450806-f7
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Run SQL in BigQuery
        run: |
          bq --project_id=psychic-diorama-450806-f7 --location=US \
            query --use_legacy_sql=false < sql/refresh_spend.sql